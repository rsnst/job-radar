name: Publish partial sweep

# Runs every 15 minutes. While a scrape run is in progress (and its build hasn't started),
# publishes the shards that have finished so far. Shards still running keep last run's jobs.
# It never saves the state cache: the scrape's own build job does that when the sweep ends.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read       # find the active scrape run and download its finished shards

concurrency:
  group: pages-deploy  # shared with the scrape build, so a partial deploy never lands after the final one
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --repo "$REPO" --workflow scrape.yml --status in_progress --limit 1 --json databaseId -q '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then echo "No sweep in progress; nothing to publish."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          build=$(gh api "repos/$REPO/actions/runs/$run_id/jobs" -q '.jobs[] | select(.name=="build") | .status')
          if [ "$build" != "queued" ] && [ -n "$build" ]; then echo "Run $run_id is past its build step ($build); skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - if: steps.find.outputs.go == 'true'
        uses: actions/checkout@v4

      - if: steps.find.outputs.go == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }

      - if: steps.find.outputs.go == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - if: steps.find.outputs.go == 'true'
        run: pip install -r requirements.txt && npm ci

      - name: Download finished shards
        id: dl
        if: steps.find.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          mkdir -p dl out
          gh run download "$RUN_ID" --repo "$REPO" --pattern 'shard-*' --dir dl || true
          # artifacts unpack to dl/shard-N/; the builder reads them from one folder
          find dl -type f -exec mv -n {} out/ \;
          n=$(ls out/summary-*.json 2>/dev/null | wc -l)
          echo "Finished shards so far: $n"
          echo "shards=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/cache/restore@v4
        if: steps.find.outputs.go == 'true'
        with:
          path: state/boards.json.gz
          key: boards-state-v2-${{ github.run_id }}
          restore-keys: boards-state-v2-
      - uses: actions/cache/restore@v4
        if: steps.find.outputs.go == 'true'
        with:
          path: state/jobs.jsonl.gz
          key: jobs-state-v2-${{ github.run_id }}
          restore-keys: jobs-state-v2-

      - name: Build partial site
        if: steps.find.outputs.go == 'true' && steps.dl.outputs.skip == 'false'
        run: |
          # without a saved state, unfinished boards would lose their jobs: wait for the first full build
          if [ ! -f state/boards.json.gz ]; then echo "No saved state yet; skipping."; exit 0; fi
          node scripts/vendor.mjs site
          python -m scraper.build_db --in out --site site --state state > build.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("site/meta.json")); r = m["run"]
          print(f"**Partial** · {r['shards']} of 40 shards finished · {m['jobs']:,} jobs\n")
          PY

      - name: Deploy
        if: steps.find.outputs.go == 'true' && steps.dl.outputs.skip == 'false' && hashFiles('site/meta.json') != ''
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - if: steps.find.outputs.go == 'true' && steps.dl.outputs.skip == 'false' && hashFiles('site/meta.json') != ''
        id: deploy
        uses: actions/deploy-pages@v4
