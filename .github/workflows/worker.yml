name: Application worker tests

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "api/employer-accounts.js"
      - "supabase/application_runs.sql"
      - "supabase/employer_accounts.sql"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - "api/employer-accounts.js"
      - "supabase/application_runs.sql"
      - "supabase/employer_accounts.sql"
      - ".github/workflows/worker.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npx playwright install chromium
        working-directory: worker
      - run: npm test
        working-directory: worker
